site_name: Mastering Django
site_url: https://example.com/docs/
dev_addr: 127.0.0.1:9000
docs_dir: docs
site_dir: site
strict: false
theme:
  name: material
  font: 
    text: Merriweather
    code: Roboto Mono
  favicon: assets/favicon.ico
  logo: assets/logo.png
  features:
    - navigation.instant      # instant page loads (SPA-like)
    - navigation.tracking     # URL updates as you scroll
    - navigation.tabs         # top-level sections as tabs
    - navigation.sections     # group units in the sidebar
    - navigation.top          # back-to-top button
    - navigation.footer       # prev/next links at page bottom
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy       # copy button on code blocks
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  palette:
    - scheme: default
      primary: green
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  # Callout / admonition boxes (your notes' callouts map here)
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
      toc_depth: 3
  - codehilite:
      guess_lang: false
  - footnotes
  - def_list
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Code: syntax highlighting, line numbers, copy
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys          # ++slash++ style keyboard hints
  - pymdownx.tabbed:
      alternate_style: true
  - md_in_html    

plugins:
  - search

